<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-slate-800 mb-4">Pokédex</h1>
      
      <div class="max-w-md mx-auto">
        <input 
          type="text" 
          id="buscador" 
          placeholder="Filtra por nombre..." 
          class="w-full p-3 rounded-lg border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>
    </header>

    <div id="resultado" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-4xl mx-auto"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
