<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex - Lab 11</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto">
    <!-- Encabezado y Buscador -->
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-slate-800 mb-4">Pokédex</h1>
      
      <div class="flex max-w-md mx-auto gap-2">
        <input 
          type="text" 
          id="buscador" 
          placeholder="Busca un Pokémon por nombre o ID..." 
          class="w-full p-3 rounded-lg border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="btn-buscar" 
          class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700 font-semibold transition"
        >
          Buscar
        </button>
      </div>
    </header>

    <!-- Estado de la Pokédex Capturada -->
    <section class="mb-6 bg-white p-4 rounded-xl shadow-sm text-center">
      <h2 class="text-lg font-semibold text-slate-700">
        Mi Pokédex: <span id="contador-pokedex" class="text-blue-600 font-bold">0</span> Pokémon capturados
      </h2>
    </section>

    <!-- Rejilla Principal de Pokémon -->
    <main id="resultado" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
      <!-- Las tarjetas se renderizan aquí dinámicamente -->
    </main>

    <!-- Botón de Paginación HU5 -->
    <div class="text-center">
      <button 
        id="btn-cargar-mas" 
        class="bg-slate-800 text-white px-6 py-3 rounded-lg hover:bg-slate-900 font-semibold transition"
      >
        Cargar más Pokémon
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
